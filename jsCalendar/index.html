<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
    <div class="year">
    <label for="year" id="year-label">Enter Year</label>
    <input type="number" id="year" min="1600" max="9999">
    </div>
    <div class="month">
    <label for="month" >Enter Month</label>
    <input type="number" id="month" min="1" max="12">
    </div>
    <div class="button">
    <button id="gen-calendar">Generate Calendar</button>
    <button id="reset">Reset</button>
    </div>
    
    <div id="calendar-display">

    </div>
    </div>
    <script src="script.js">

    </script>
</body>
</html>
