<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        #result, #strResult { white-space: pre-line; }
    </style>
</head>
<body>
    <h2>Maths</h2>
    <label for="num1">Number 1</label>
    <input type="number" id="num1" placeholder="Enter first number">
    <label for="num2">Number 2</label>
    <input type="number" id="num2" placeholder="Enter second number">
    <br><br>
    <button onclick="power()">Power</button>
    <button onclick="squareRoot()">Square Root</button>
    <button onclick="round()">Round</button>
    <button onclick="ceiling()">Ceiling</button>
    <button onclick="floor()">Floor</button>
    <button onclick="absolute()">Absolute</button>
    <button onclick="sincos()">Sine/Cosine</button>
    <button onclick="minmax()">Minimum and Maximum</button>
    <button onclick="random()">Random</button>
    <p id="result"></p>

    <h2>Strings</h2>
    <label for="string">String</label>
    <input type="text" id="string" placeholder="Enter string">
    <br><br>
    <label for="operations">Word</label>
    <input type="text" id="operations" placeholder="Word to find or replace">
    <label for="replacement">Replacement</label>
    <input type="text" id="replacement" placeholder="Replacement word">
    <br><br>
    <label for="box1">Start</label>
    <input type="number" id="box1">
    <label for="box2">End</label>
    <input type="number" id="box2">
    <label for="box3">Length (substr)</label>
    <input type="number" id="box3">
    <br><br>
    <button onclick="lengthStr()">Length</button>
    <button onclick="firstLast()">First and Last occurrence</button>
    <button onclick="searchStr()">Search</button>
    <button onclick="slice()">Slice</button>
    <button onclick="substring()">Substring</button>
    <button onclick="substr()">Substr</button>
    <button onclick="replaceWord()">Replace</button>
    <button onclick="upper()">Upper Case</button>
    <button onclick="lower()">Lower Case</button>
    <p id="strResult"></p>

    <script src="script.js"></script>
</body>
</html>
