<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>Maths</h2>
    <label for="num1">Number 1</label>
    <input type="number" id="num1" placeholder="Enter first number">
    <label for="num2">Number 2</label>
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="power()">Power</button>
    <button onclick="squareRoot()">Square Root</button>
    <button onclick="round()">Round</button>
    <button onclick="ceiling()">Ceiling</button>
    <button onclick="floor()">Floor</button>
    <button onclick="absolute()">Absolute</button>
    <button onclick="sincos()">Sine/Cosine</button>
    <button onclick="minmax()">minimum and maximum</button>
    <button onclick="random()">Random</button>
    <p id="result"></p>

    <h2>Strings</h2>
    <label for="string">String</label>
    <input type="text" id="string" placeholder="Enter String">
    <label for="operations">input for operations</label>
    <input type="text" id="operations">
    <label for="box1">number 1</label>
    <input type="number" id="box1">
    <label for="box2">number 2</label>
    <input type="number" id="box2">
    <button onclick="lengthStr()">Length</button>
    <button onclick="firstLast()">First and Last occurrence</button>
    <button onclick="searchStr()">Search</button>
    <button onclick="slice()">Slice</button>
    <button onclick="substring()">Substring</button>
    <button onclick="replace()">Replace</button>
    <button onclick="toUpper()">Upper Case</button>
    <button onclick="toLower()">Lower Case</button>
    <p id="strResult"></p>

    <script src="script.js"></script>
</body>
</html>
